name: Invoice regeneration safety checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/invoice-regeneration-checks.yml'
  workflow_dispatch:
jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compile backend
        run: npm run build
