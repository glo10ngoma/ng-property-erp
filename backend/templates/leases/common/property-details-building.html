<section class="contract-property-details">
  <h2 class="contract-section-title">PRÉCISIONS SUR LE BIEN LOUÉ</h2>
  <table class="contract-table">
    <tbody>
      <tr><th>Nature du bien</th><td>{{propertyNature}}</td></tr>
      <tr><th>Immeuble</th><td>{{buildingName}}</td></tr>
      <tr><th>Adresse</th><td>{{propertyAddress}}</td></tr>
      <tr><th>Composition</th><td>{{propertyComposition}}</td></tr>
      <tr><th>Nombre d’unités</th><td>{{buildingUnitCount}}</td></tr>
      <tr><th>Usage</th><td>{{usageDisplay}}</td></tr>
      <tr><th>Date de début du bail</th><td>{{startDate}}</td></tr>
    </tbody>
  </table>
</section>
